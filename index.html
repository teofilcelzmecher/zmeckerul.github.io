<title>Desktop</title>
<style>
:root{--tb:#383838;--win:#1e1e1e;--ttl:#b4b4b4;--mute:#9b9ba1;--blue:#0a84ff;--ic:clamp(36px,11.4vw,54px);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{height:100%;background:#0a1070}
body{height:100%;overflow:hidden;background:#0a1070 center/cover no-repeat;color:#fff;font:13px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
#bar{position:fixed;inset:0 0 auto;z-index:9999;height:calc(28px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;display:flex;align-items:center;justify-content:space-between;background:rgba(6,8,56,.2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-weight:500}
#bar div{display:flex;align-items:center;gap:17px}
#bar svg{display:block}
#bar b{font-weight:700}
#desk{position:fixed;inset:0}
.win{position:absolute;width:340px;border-radius:12px;background:var(--win);overflow:hidden;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.16),0 22px 60px rgba(0,0,24,.55),0 3px 10px rgba(0,0,24,.4);transition:opacity .25s,transform .25s}
.win.off{opacity:0;transform:scale(.8);pointer-events:none}
.win:focus-visible,.dk:focus-visible,.go:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tb{position:relative;height:28px;display:flex;align-items:center;justify-content:center;background:var(--tb);border-bottom:1px solid #000;cursor:grab;touch-action:none}
.tb b{font-size:13px;font-weight:600;color:var(--ttl)}
.dots{position:absolute;left:8px;display:flex;gap:8px}
.dots i{width:12px;height:12px;border-radius:50%;display:grid;place-items:center;font:700 9px/1 sans-serif;color:transparent;cursor:pointer}
.dots:hover i{color:rgba(0,0,0,.55)}
.dots .r{background:#ff5f57}.dots .r::after{content:"×"}
.dots .y{background:#febc2e}.dots .y::after{content:"−"}
.dots .g{background:#28c840}.dots .g::after{content:"↗"}
.body{display:flex;align-items:center;gap:14px;padding:16px 18px}
.body div{flex:1;min-width:0}
.body h2{font-size:17px;font-weight:600}
.body p{margin-top:2px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app,.dk{background:var(--c)}
.app{flex:none;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 2px 6px rgba(0,0,0,.35)}
.app svg{width:64%;height:64%}
.go{padding:5px 15px;border-radius:99px;background:var(--blue);color:#fff;font-weight:500;text-decoration:none}
.go:hover{background:#3b9bff}
#dock{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9998;display:flex;gap:calc(var(--ic)*.16);padding:calc(var(--ic)*.14);border-radius:calc(var(--ic)*.5);background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);box-shadow:0 12px 40px rgba(0,0,30,.35)}
.dk{position:relative;width:var(--ic);height:var(--ic);border:0;padding:0;border-radius:calc(var(--ic)*.24);display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.dk svg{width:60%;height:60%}
.dk:hover{transform:translateY(-10px) scale(1.22)}
.dk::after{content:"";position:absolute;left:50%;bottom:calc(var(--ic)*-.12);width:4px;height:4px;margin-left:-2px;border-radius:50%;background:rgba(255,255,255,.85)}
.dk.off::after{display:none}
.dk::before{content:attr(data-n);position:absolute;left:50%;bottom:calc(100% + 12px);transform:translateX(-50%);padding:3px 9px;border-radius:6px;background:rgba(36,36,40,.92);font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.dk:hover::before{opacity:1}
.bounce{animation:bn .55s}
@keyframes bn{30%{transform:translateY(-22px)}60%{transform:none}80%{transform:translateY(-8px)}}
#toast{position:fixed;top:calc(38px + env(safe-area-inset-top,0px));right:12px;z-index:10000;max-width:calc(100vw - 24px);padding:10px 14px;border-radius:14px;background:rgba(40,40,44,.82);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 0 0 1px rgba(255,255,255,.12),0 10px 30px rgba(0,0,24,.4);opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:none}
@media(max-width:700px){.win{width:min(300px,84vw)}.body{padding:12px 14px}.app{width:44px;height:44px}.body h2{font-size:15px}.l span,.hide{display:none}}
@media(hover:none){.dots{pointer-events:none}.dk:hover{transform:none}.dk:hover::before{opacity:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const $=s=>document.querySelector(s),desk=$('#desk'),dock=$('#dock'),lnk=$('#lnk'),clk=$('#clk'),toast=$('#toast');
function cp(t){
 const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0;-webkit-user-select:text;user-select:text';
 document.body.append(a);a.select();a.setSelectionRange(0,99);
 let ok=0;try{ok=document.execCommand('copy')}catch(_){}
 a.remove();
 const show=m=>{toast.textContent=m;toast.classList.add('show');clearTimeout(cp.t);cp.t=setTimeout(()=>toast.classList.remove('show'),2600)};
 if(ok)show('Discord username copied: '+t);
 else{show('Discord username: '+t);navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>show('Discord username copied: '+t),()=>{})}
}
const go=u=>u.startsWith('copy:')?cp(u.slice(5)):(lnk.href=u,lnk.click());
const J=[[-24,-30],[20,14],[-8,-18],[26,28],[-28,12],[12,-8]];
let z=10,d=null;
S.forEach((s,i)=>{
 const w=document.createElement('article');
 w.className='win';w.tabIndex=0;w.dataset.i=i;
 w.onkeydown=e=>{if(e.key==='Enter'&&e.target===w)go(s.u)};
 w.innerHTML=`<header class="tb"><span class="dots"><i class="r"></i><i class="y"></i><i class="g"></i></span><b>${s.n}</b></header><div class="body"><span class="app" style="--c:${s.c}"><svg viewBox="0 0 24 24">${I[s.i]}</svg></span><div><h2>${s.n}</h2><p>${s.h}</p></div>${s.u.startsWith('copy:')?'<span class="go">Copy</span>':`<a class="go" href="${s.u}" target="_blank" rel="noopener noreferrer">Open</a>`}</div>`;

function place(){
 const W=innerWidth,H=innerHeight,top=40,bot=118,n=S.length,small=W<700,c=W>1100?3:2;
 [...desk.children].forEach((w,i)=>{
  if(w.moved)return;
  const ww=w.offsetWidth,wh=w.offsetHeight;let x,y;
  if(small){x=(W-ww)/2+(i%2?14:-14);y=top+i*Math.max(56,(H-top-bot-wh)/(n-1))}
  else{const r=Math.ceil(n/c),cw=W/c,ch=(H-top-bot)/r;const m=Math.min(c,n-Math.floor(i/c)*c);x=(W-m*cw)/2+(i%c)*cw+(cw-ww)/2+J[i%6][0];y=top+Math.floor(i/c)*ch+(ch-wh)/2+J[i%6][1]}

 });
}

};

};

};
