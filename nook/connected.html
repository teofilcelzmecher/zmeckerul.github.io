<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https: http://127.0.0.1:*; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Linking Spotify · Budgie</title>
  <link rel="stylesheet" href="../m3/fonts/fonts.css">
  <link rel="stylesheet" href="../m3/m3.css">
  <link rel="stylesheet" href="legal.css">
  <style>
    .linked { display: grid; justify-items: center; gap: 16px; padding: 12vh 0 8vh; text-align: center; }
    .linked m3-shape { width: 120px; height: 120px; color: var(--m3-primary-container); transition: color 400ms; }
    .linked.ok m3-shape { color: #1db954; }
    .linked.no m3-shape { color: var(--m3-error-container); }
    .linked h1 { margin: 0; }
    .linked p { max-width: 28em; margin: 0; color: var(--m3-on-surface-variant); }
    .linked .m3-btn.filled { color: var(--m3-on-primary); text-decoration: none; }
  </style>
</head>
<body class="m3-base">
  <!-- (1.7) where Spotify sends someone back after they link it: Spotify's answer goes to Budgie's server from here
       (js/connected.js), and the page says how it went -->
  <main class="legal">
    <div class="legal-top">
      <a class="brand" href="./"><m3-shape shape="cookie9" aria-hidden="true"></m3-shape>budgie</a>
    </div>
    <section class="linked" id="linked" aria-live="polite">
      <m3-shape shape="cookie9" id="linked-shape" aria-hidden="true"></m3-shape>
      <h1 id="linked-title">Linking Spotify…</h1>
      <p id="linked-text">Just a moment.</p>
      <p><a class="m3-btn filled" href="./" id="linked-back">Go to Budgie</a></p>
    </section>
  </main>
  <script src="../m3/m3-shapes.js"></script>
  <script src="../m3/m3.js"></script>
  <script src="js/config.js"></script>
  <script src="js/connected.js"></script>
</body>
</html>
