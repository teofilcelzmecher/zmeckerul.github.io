<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- GitHub Pages shows this for any address that doesn't exist, however deep, so links start from the top -->
  <base href="/">
  <title>Page not found · Budgie</title>
  <link rel="stylesheet" href="../m3/fonts/fonts.css">
  <link rel="stylesheet" href="../m3/m3.css">
  <link rel="stylesheet" href="legal.css">
  <style>
    .lost { display: grid; justify-items: center; gap: 16px; padding: 12vh 0 8vh; text-align: center; }
    .lost m3-shape { width: 120px; height: 120px; color: var(--m3-primary-container); }
    .lost h1 { margin: 0; }
    .lost p { max-width: 28em; margin: 0; color: var(--m3-on-surface-variant); }
    .lost .m3-btn.filled { color: var(--m3-on-primary); text-decoration: none; }
  </style>
</head>
<body class="m3-base">
  <main class="legal">
    <div class="legal-top">
      <a class="brand" href="./"><m3-shape shape="cookie9" aria-hidden="true"></m3-shape>budgie</a>
    </div>
    <section class="lost">
      <m3-shape shape="ghostish" aria-hidden="true"></m3-shape>
      <h1>This page has flown away</h1>
      <p>There’s nothing at this address. Budgie itself is just one hop away.</p>
      <p><a class="m3-btn filled" href="./">Go to Budgie</a></p>
    </section>
  </main>
  <script src="../m3/m3-shapes.js"></script>
  <script src="../m3/m3.js"></script>
</body>
</html>
